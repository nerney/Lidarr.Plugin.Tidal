name: Build Plugin

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_VERSION: 10.0.404
  PLUGIN_NAME: Lidarr.Plugin.Tidal
  PLUGIN_VERSION: 12.0.0.${{ github.run_number }}
  MINIMUM_LIDARR_VERSION: 3.0.0.4855
  WarningsNotAsErrors: "NU1902;NU1903"

jobs:
  build:
    strategy:
      matrix:
        framework: 
          - net8.0
          - net10.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: |
          echo '{"sdk":{"version": "${{ env.DOTNET_VERSION }}"}}' > ./global.json
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$PLUGIN_VERSION<\/AssemblyVersion>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${GITHUB_REF#refs/heads/}<\/AssemblyConfiguration>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$MINIMUM_LIDARR_VERSION<\/AssemblyVersion>/g" ext/Lidarr/src/Directory.Build.props
          dotnet restore src/*.sln
          dotnet build src/Lidarr.Plugin.Tidal/Lidarr.Plugin.Tidal.csproj -c Release -f ${{ matrix.framework }} --no-restore -p:SolutionDir="$GITHUB_WORKSPACE/src/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}.${{ matrix.framework }}
          path: ./_plugins/${{ matrix.framework }}/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.*

      - name: Generate Changelog
        run: |
          echo "Changelog:" > changelog.txt
          git log --oneline $(git describe --tags --abbrev=0)..HEAD | awk '{print "- " substr($0, index($0,$2))}' >> changelog.txt

      - name: Display Changelog
        run: cat changelog.txt

      - name: Zip Plugin
        run: |
          sudo apt update && sudo apt install -y p7zip-full
          7z a -tzip ${{ env.PLUGIN_NAME }}.${{ matrix.framework }}.zip ./_plugins/${{ matrix.framework }}/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.*

      - name: Upload Release Asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.PLUGIN_VERSION }}.${{ matrix.framework }}
          name: ${{ env.PLUGIN_VERSION }}.${{ matrix.framework }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          files: |
            ${{ env.PLUGIN_NAME }}.${{ matrix.framework }}.zip